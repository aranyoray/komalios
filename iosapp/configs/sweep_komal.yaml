# configs/sweep_komal.yaml — hydra sweep config for ablations
defaults:
  - _self_
  - override hydra/launcher: submitit_slurm

hydra:
  sweeper:
    params:
      # model architecture
      model.num_layers: choice(12, 24, 36)
      model.attention_type: choice(full, performer, linformer)
      model.dim: choice(512, 768, 1024)
      model.ffn_dim: choice(2048, 3072, 4096)
      model.dropout: interval(0.0, 0.3)

      # spectrogram params
      audio.n_fft: choice(512, 1024, 2048)
      audio.hop_length: choice(128, 256, 512)
      audio.n_mels: choice(64, 80, 128)

      # frame processing
      video.frame_rate: choice(15, 30, 60)
      video.resolution: choice(112, 224)

      # augmentation grid
      aug.time_stretch: interval(0.8, 1.2)
      aug.pitch_shift: interval(-3, 3)
      aug.spec_augment_time: choice(0, 20, 40)
      aug.spec_augment_freq: choice(0, 10, 20)
      aug.mixup_alpha: choice(0.0, 0.2, 0.4)

      # training
      training.lr: loguniform(1e-5, 1e-3)
      training.weight_decay: loguniform(1e-4, 1e-1)
      training.batch_size: choice(16, 32, 64)
      training.warmup_ratio: interval(0.01, 0.1)

  launcher:
    partition: {{SLURM_PARTITION}}
    gpus_per_node: 2
    cpus_per_task: 8
    mem_gb: 64
    timeout_min: 720
    max_num_timeout: 3

sweep:
  max_concurrent: 50
  total_trials: 2000

experiment:
  dataset_root: {{DATASET_ROOT}}
  checkpoint_root: {{CHECKPOINT_ROOT}}
  output_dir: ${checkpoint_root}/sweeps/${hydra.job.name}

aggregation:
  metrics: [val_loss, val_acc, val_f1, mmd_score]
  output_csv: ${checkpoint_root}/sweeps/sweep_results.csv
