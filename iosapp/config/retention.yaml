# Data Retention Policy Configuration
# Used by safe_retention_policy_enforcer.py

policies:
  raw_recordings:
    description: "Video/audio raw recordings - delete immediately after analytics"
    patterns:
      - "*.mp4"
      - "*.avi"
      - "*.mov"
      - "*.wav"
      - "*.mp3"
      - "*.raw"
      - "*.bin"
    retention_days: 0  # Delete after analytics success
    secure_delete: true

  processed_analytics:
    description: "Processed session scores and reports"
    patterns:
      - "*_scores.json"
      - "*_report.pdf"
      - "*_analytics.json"
    retention_days: 365  # 1 year
    secure_delete: false

  anonymized_aggregates:
    description: "Anonymized aggregate data for research"
    patterns:
      - "*_aggregate.json"
      - "*_anonymized.json"
    retention_days: 1825  # 5 years
    secure_delete: false

  temp_files:
    description: "Temporary processing files"
    patterns:
      - "*.tmp"
      - "*.cache"
      - "*.partial"
    retention_days: 1
    secure_delete: false

  logs:
    description: "Application logs"
    patterns:
      - "*.log"
    retention_days: 90
    secure_delete: false

# Storage settings
storage:
  local_path: "./data"
  s3_bucket: ""  # Set via CLI or environment
  max_parallel_deletions: 4

# Whitelist settings
whitelist:
  # Sessions flagged for clinical review should not be auto-deleted
  clinical_review_pattern: "*_clinical_review"
  # Allow specific session IDs to be whitelisted
  session_ids: []
